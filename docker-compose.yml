version: '3.8'

services:
  api:
    build: .
    container_name: juriscore-api
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@db:5432/juriscore
    depends_on:
      - db
    restart: always

  db:
    image: pgvector/pgvector:pg15
    container_name: juriscore-db
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=juriscore
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

volumes:
  postgres_data:
